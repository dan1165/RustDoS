name: iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  XTOOL_VERSION: "1.22.2"
  SWIFT_VERSION: "6.4.1"
  SDK_URL: "https://github.com/dan1165/RustDoS/releases/download/ios-sdk/darwin-sdk.tar.zst"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        run: |
          curl -fL -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          tar xzf swift.tar.gz
          echo "$PWD/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"

      - name: Install xtool
        run: |
          curl -fL -o xtool.AppImage \
            "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool-x86_64.AppImage"
          chmod +x xtool.AppImage
          ./xtool.AppImage --appimage-extract > /dev/null
          sudo ln -sf "$PWD/squashfs-root/AppRun" /usr/local/bin/xtool

      - name: Install Darwin SDK
        run: |
          curl -fL -o sdk.tar.zst "$SDK_URL"
          tar -I zstd -xf sdk.tar.zst
          mv darwin.artifactbundle darwin.xtoolsdk
          xtool sdk install darwin.xtoolsdk

      - name: Build unsigned IPA
        working-directory: ios
        run: xtool dev build -c release --ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RustDoS-unsigned-ipa
          path: ios/xtool/RustDoS.ipa
          if-no-files-found: error
